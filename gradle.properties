org.gradle.caching = true
# KSP does not support the configuration cache in this setup.
org.gradle.configuration-cache = false
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel = true
kotlin.code.style = official

group = org.eclipse.apoapsis.sbom
version = 0.1.0-SNAPSHOT

# The Java version the published classes are compiled for; it must match the one required by ORT (25 for ORT 98).
javaTargetVersion = 25
