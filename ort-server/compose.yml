# Use the images with the ORT SBOM plugin in the Docker Compose setup of ORT Server. In a checkout of ORT Server:
#
#   ORT_SERVER_IMAGE_TAG=0.99.1 docker compose -f docker-compose.yml -f <ort-sbom-plugin>/ort-server/compose.yml up
#
# ORT_SERVER_IMAGE_TAG must be a release of ORT Server for which images with the plugin exist.
# ORT_SERVER_SBOM_IMAGE_PREFIX selects images built with build-images.sh, such as "ort-server-sbom/".

services:
  core:
    image: ${ORT_SERVER_SBOM_IMAGE_PREFIX-ghcr.io/heurtematte/}ort-server-core:${ORT_SERVER_IMAGE_TAG:?set ORT_SERVER_IMAGE_TAG to a release of ORT Server}

  analyzer-worker:
    image: ${ORT_SERVER_SBOM_IMAGE_PREFIX-ghcr.io/heurtematte/}ort-server-analyzer-worker:${ORT_SERVER_IMAGE_TAG:?set ORT_SERVER_IMAGE_TAG to a release of ORT Server}
